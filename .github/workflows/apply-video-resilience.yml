name: apply-video-resilience

on:
  push:
    branches:
      - feat/separate-video-resilience-37.5.1
    paths:
      - scripts/apply-video-resilience-37.5.1.cjs
      - .github/workflows/apply-video-resilience.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/separate-video-resilience-37.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic video resilience patch
        run: node scripts/apply-video-resilience-37.5.1.cjs
      - name: Verify patched tree
        run: |
          node --check twitch-adblock.user.js
          node check.js
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitch-adblock.user.js check.js check-hardening.js
          git commit -m "feat: add standalone video resilience for 37.5.1"
          git push origin HEAD:feat/separate-video-resilience-37.5.1
