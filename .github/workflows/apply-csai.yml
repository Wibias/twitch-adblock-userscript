name: apply-csai

on:
  push:
    branches:
      - feat/csai-observability-37.6.0
    paths:
      - scripts/apply-csai-37.6.0.cjs
      - scripts/fix-csai-hardening-harness.cjs
      - .github/workflows/apply-csai.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/csai-observability-37.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Supply CSAI dependencies in legacy fetch harness
        run: node scripts/fix-csai-hardening-harness.cjs
      - name: Apply deterministic CSAI patch
        run: node scripts/apply-csai-37.6.0.cjs
      - name: Verify patched tree
        run: |
          node --check twitch-adblock.user.js
          node check.js
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitch-adblock.user.js check.js check-hardening.js
          git commit -m "feat: add CSAI observability for 37.6.0"
          git push origin HEAD:feat/csai-observability-37.6.0
