name: apply-codec-safety

on:
  push:
    branches:
      - feat/codec-safety-37.5.0
    paths:
      - scripts/apply-codec-safety-37.5.0.cjs
      - .github/workflows/apply-codec-safety.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codec-safety-37.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic codec patch
        run: node scripts/apply-codec-safety-37.5.0.cjs
      - name: Verify patched tree
        run: |
          node --check twitch-adblock.user.js
          node check.js
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitch-adblock.user.js check.js check-hardening.js
          git commit -m "feat: harden codec handling for 37.5.0"
          git push origin HEAD:feat/codec-safety-37.5.0
